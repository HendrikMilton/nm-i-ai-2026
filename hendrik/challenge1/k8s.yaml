apiVersion: v1
kind: Service
metadata:
  name: tripletex-tunnel
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tripletex-tunnel
  namespace: default
subsets:
  - addresses:
      - ip: 157.90.171.156
    ports:
      - port: 4001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripletex-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tripletex.hycapital.io
      secretName: tripletex-cert
  rules:
    - host: tripletex.hycapital.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tripletex-tunnel
                port:
                  number: 4001
